name: Automated EC2 Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Fetch the latest code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Automatically connect to EC2 and update the app
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Move into your project directory on the server
            cd ~/node-cicd-demo/projectec2 || cd ~/node-cicd-demo

            # 2. Automatically pull the new changes
            git pull origin main

            # 3. Install any new dependencies
            npm install --production

            # 4. Restart PM2 so the website updates instantly
            pm2 restart all || pm2 start app.js --name "node-app"